name: Trigger Ruck Registry Sync

on:
  push:
    branches:
      - ruck
    paths:
      - 'plugins/**/plugin.json'
      - 'plugins/**/package.json'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository dispatch event
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.REGISTRY_TRIGGER_TOKEN }}" \
            https://api.github.com/repos/iamxiaojianzheng/ruck-plugin-registry/dispatches \
            -d '{"event_type": "sync-plugins"}'
